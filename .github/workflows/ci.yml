name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck herdr-omarchy-theme install.sh uninstall.sh tests/run.sh tests/stubs/*
      - name: Tests
        run: tests/run.sh

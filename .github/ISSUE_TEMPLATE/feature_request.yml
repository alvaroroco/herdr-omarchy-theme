name: Idea
description: Something the mod could do better or differently.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you'd see or be able to do, and why it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
